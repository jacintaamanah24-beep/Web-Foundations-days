<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Home</title>
</head>

<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Your simple digital notes companion.</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Welcome to QuickNotes</h2>

            <p>
                QuickNotes is a simple application for capturing
                and organizing your notes.
            </p>
        </section>

        <section>
            <h2>Add a Note</h2>

            <form id="note-form">

                <label for="note-input">New note</label>

                <input
                    type="text"
                    id="note-input"
                    name="note"
                    placeholder="What do you want to remember?"
                    required
                >

                <button type="submit">Add Note</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 QuickNotes</p>
    </footer>

</body>

</html>
